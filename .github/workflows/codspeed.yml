name: CodSpeed
# Manual only for now: shared-runner walltime numbers are too noisy to gate
# PRs. To turn it back on, add pull_request and push (branches: [main])
# triggers.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # Required for OIDC authentication with CodSpeed
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: jwtauth/go.sum
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: walltime
          working-directory: jwtauth
          run: go test -bench=. .
